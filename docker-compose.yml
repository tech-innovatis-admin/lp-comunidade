# docker-compose.yml para Landing Page Comunidade InnovaNation
# Uso: docker-compose up -d

version: '3.8'

services:
  landing-comunidade:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: landing-comunidade-innovatis
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Banco de dados
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL:-true}
      - DATABASE_URL=${DATABASE_URL}
      # AWS S3
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      # Google Sheets
      - GOOGLE_CREDENTIALS_S3_BUCKET=${GOOGLE_CREDENTIALS_S3_BUCKET}
      - GOOGLE_CREDENTIALS_S3_KEY=${GOOGLE_CREDENTIALS_S3_KEY}
      - GOOGLE_CREDENTIALS_S3_REGION=${GOOGLE_CREDENTIALS_S3_REGION:-us-east-2}
      - GOOGLE_SHEET_NAME=${GOOGLE_SHEET_NAME}
      # URL pública
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://comunidade.innovatismc.com}
      - EDITAL_TOKEN_SECRET=${EDITAL_TOKEN_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

